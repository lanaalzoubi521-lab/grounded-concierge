<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raml Home · Grounded Concierge</title>
<meta name="description" content="A ceramics store whose AI concierge only answers from live catalogue and stock data.">
<meta property="og:type" content="website">
<meta property="og:title" content="Raml Home · Grounded Concierge">
<meta property="og:description" content="An AI shopping concierge that checks prices, stock and policies against the live catalogue before it replies.">
<meta property="og:url" content="https://lanaalzoubi521-lab.github.io/grounded-concierge/">
<meta property="og:image" content="https://lanaalzoubi521-lab.github.io/grounded-concierge/home.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="author" content="Lana Alzoubi">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23B4532A'/><circle cx='16' cy='16' r='6' fill='white'/></svg>">
<style>

/*FONTS*/
:root{--bg:#ECE8E0;--ink:#151412;--mute:#77736C;--line:rgba(21,20,18,.14);--acc:#1F2C8F;--e:cubic-bezier(.2,.7,0,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg)}
body{font-family:Plex,PlexAr,system-ui,sans-serif;color:var(--ink);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
html[dir=rtl] body{font-family:PlexAr,Plex,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:0}
button{cursor:pointer}
canvas{display:block}
#shot{position:fixed;left:-9999px;top:0;width:520px;height:520px}
#announce{position:fixed;inset:0 0 auto;height:32px;line-height:32px;display:block;font-size:12.5px;background:var(--ink);color:#ECE8E0;z-index:21;padding:0 16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header{position:fixed;inset:32px 0 auto;display:flex;justify-content:space-between;align-items:center;gap:24px;padding:16px 48px;z-index:20;background:rgba(236,232,224,.92);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.cats{display:flex;gap:22px;font-size:14.5px}
.cats a{color:var(--mute)}.cats a:hover,.cats a.on{color:var(--ink)}
.hsearch{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:4px 0;width:160px}
.hsearch input{border:0;outline:0;background:none;width:100%;font-size:14px}
.logo{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:.2px}
.logo svg{width:16px;height:26px}
.logo path{fill:none;stroke:var(--acc);stroke-width:1.6;stroke-linecap:round}
nav{display:flex;gap:30px;font-size:15px;align-items:center}
nav a,nav button{color:var(--mute);transition:color .3s}
nav a.on,nav a:hover,nav button:hover{color:var(--ink)}
#langbtn{font-family:PlexAr,Plex;color:var(--ink)}
html[dir=rtl] #langbtn{font-family:Plex}
.view{display:none;min-height:100vh}
.view.on{display:block;animation:in .8s var(--e) both}
.view.out{animation:out .42s var(--e) both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-20px)}}
.k{font-size:14px;color:var(--mute);letter-spacing:.3px}
html[dir=rtl] .k{letter-spacing:0}
/* home */
#v-home .heroW{position:relative;height:calc(100vh - 32px);min-height:640px;overflow:hidden}
#hero{position:absolute;inset:0;width:100%;height:100%}
.htext{position:absolute;inset-inline-start:48px;bottom:9vh;max-width:620px;z-index:2;pointer-events:none}
.htext *{pointer-events:auto}
h1{font-weight:500;font-size:clamp(46px,6.2vw,98px);line-height:1;letter-spacing:-.025em;margin-top:18px}
html[dir=rtl] h1{letter-spacing:0;line-height:1.15}
h1 span{display:block}
h1 span+span{color:var(--acc)}
.sub{font-size:20px;font-weight:300;line-height:1.45;color:#3B3934;max-width:34ch;margin-top:26px}
.ctas{display:flex;gap:36px;margin-top:38px;font-size:17px}
.ctas a{border-bottom:1px solid var(--ink);padding-bottom:6px;transition:color .3s,border-color .3s}
.ctas a:hover{color:var(--acc);border-color:var(--acc)}
#hero-prof{position:absolute;top:50%;inset-inline-end:4vw;transform:translateY(-50%);z-index:2}
.prof path{fill:none;stroke:var(--acc);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
html[dir=rtl] #hero-prof svg,html[dir=rtl] #pd-prof svg{transform:scaleX(-1)}
.prof.draw path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s .3s var(--e) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cap{position:absolute;inset-inline-end:4vw;bottom:9vh;font-size:13px;color:var(--mute);text-align:end;z-index:2;line-height:1.6}
/* collection */
.wrap{padding:140px 48px 80px;max-width:1440px;margin:0 auto}
.chead{display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:22px}
h2{font-size:clamp(38px,4.6vw,68px);font-weight:500;letter-spacing:-.02em;line-height:1.02}
html[dir=rtl] h2{letter-spacing:0;line-height:1.2}
#kinds{display:flex;gap:22px;flex-wrap:wrap;font-size:15px}
#kinds button{color:var(--mute)}#kinds button.on{color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(4,1fr);gap:56px 32px;margin-top:48px}
.tile{display:block;animation:in .9s var(--e) both;animation-delay:var(--d)}
.tile .img{position:relative;aspect-ratio:1}
.tile img{width:100%;height:100%;object-fit:contain;transition:transform .8s var(--e)}
.tile:hover img{transform:scale(1.04) translateY(-6px)}
.tile .tp{position:absolute;top:8%;inset-inline-end:2%;opacity:0;transition:opacity .4s}
.tile .tp path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.2s var(--e)}
.tile:hover .tp{opacity:1}.tile:hover .tp path{stroke-dashoffset:0}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;border-top:1px solid var(--line);padding-top:14px}
.meta b{font-weight:500}
.meta span{white-space:nowrap}
.st{font-size:14px;color:var(--mute);margin-top:4px}
.so{color:#9A4A2E}
/* product */
#v-product .pgrid{display:grid;grid-template-columns:1.25fr 1fr;min-height:100vh;padding-top:96px}
#big{width:100%;flex:1;min-height:0}
.stagecol{position:sticky;top:96px;height:calc(100vh - 110px);display:flex;flex-direction:column;padding-bottom:12px}
.pinfo{padding:110px 48px 60px;display:flex;flex-direction:column;justify-content:center;gap:0;max-width:560px}
.back{font-size:14px;color:var(--mute);margin-bottom:40px}
.back:hover{color:var(--ink)}
#pd-name{margin-top:14px}
.prow{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px}
#pd-price{font-size:26px;font-weight:500}
#pd-spec{font-size:14px;color:var(--mute)}
#pd-desc{font-size:18px;line-height:1.55;color:#3B3934;margin-top:24px;font-weight:300}
.pprof{display:flex;gap:18px;align-items:end;margin-top:22px}
.pprof .k{max-width:20ch}
dl{margin-top:28px;border-top:1px solid var(--ink)}
dl .k{padding:14px 0 4px}
dl div{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
dd{font-weight:500}dd.z{color:var(--mute)}
.asof{font-size:13px;color:var(--mute);margin-top:12px}
.pbtns{display:flex;gap:26px;align-items:center;margin-top:30px;flex-wrap:wrap}
.primary{background:var(--ink);color:var(--bg);padding:16px 30px;font-size:16px;transition:background .3s,transform .4s var(--e)}
.primary:hover:not(:disabled){background:var(--acc);transform:translateY(-2px)}
.primary:disabled{opacity:.35;cursor:default}
.link{border-bottom:1px solid var(--ink);padding-bottom:4px}
.link:hover{color:var(--acc);border-color:var(--acc)}
/* drawers */
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(460px,100vw);background:#F6F3EC;z-index:30;transform:translateX(105%);transition:transform .7s var(--e);display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line)}
html[dir=rtl] .drawer{transform:translateX(-105%)}
.chat-open #chat,.bag-open #bag{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:26px 30px;border-bottom:1px solid var(--line)}
.dh b{font-weight:500}
.dh button{font-size:14px;color:var(--mute)}
#msgs{list-style:none;flex:1;overflow:auto;padding:26px 30px;display:flex;flex-direction:column;gap:20px}
#msgs li{max-width:92%;animation:in .5s var(--e) both}
#msgs .me{align-self:flex-end;background:var(--ink);color:var(--bg);padding:12px 16px}
#msgs .bot p{line-height:1.6}
.wait{color:var(--mute)}
.card{display:flex;gap:14px;align-items:center;margin-top:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;color:var(--mute)}
.card img{width:64px;height:64px;object-fit:contain;background:var(--bg)}
.card b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.card:hover b{color:var(--acc)}
.g{display:block;font-style:normal;font-size:12px;color:var(--mute);margin-top:10px}
.g.warn{color:#9A4A2E}
#tries{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:0 30px 16px;font-size:14px}
#tries button{color:var(--mute);text-align:start}#tries button:hover{color:var(--ink)}
#form{display:flex;border-top:1px solid var(--ink);margin:0 30px 14px}
#q{flex:1;padding:18px 0;font-size:16px;outline:none}
#form button{color:var(--acc);font-weight:500}
#mode{font-size:12px;color:var(--mute);padding:0 30px 20px;min-height:20px}
#bag-list{list-style:none;flex:1;overflow:auto;padding:10px 30px}
#bag-list li{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
#bag-list img{width:56px;height:56px;object-fit:contain;background:var(--bg)}
#bag-list .e{display:block;color:var(--mute);border:0}
.btot{padding:22px 30px;border-top:1px solid var(--ink);display:flex;justify-content:space-between;font-weight:500}
.bnote{padding:0 30px 26px;font-size:13px;color:var(--mute)}
footer{font-size:13px;color:var(--mute);padding:0 48px 36px;display:flex;justify-content:space-between;gap:20px;max-width:1440px;margin:0 auto}
@media(max-width:900px){
  header{padding:16px 20px}nav{gap:16px;font-size:14px}.navc{display:none}
  #v-home{height:auto;min-height:100vh}
  #hero{position:relative;inset:auto;width:100%;height:58vh;margin-top:64px}
  html[dir=rtl] #hero{inset:auto}
  .htext{position:relative;inset:auto;padding:0 20px 50px}
  #hero-prof,.cap{display:none}
  .sub{font-size:18px}
  .wrap{padding:96px 20px 60px}
  #grid{grid-template-columns:repeat(2,1fr);gap:36px 16px}
  .meta{flex-direction:column;gap:2px}
  #v-product .pgrid{grid-template-columns:1fr}
  #big{position:relative;height:56vh;margin-top:60px}
  .pinfo{padding:10px 20px 60px}
  footer{padding:0 20px 30px;flex-direction:column}
}

.newin{padding:80px 48px 40px;max-width:1440px;margin:0 auto}
.rowh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--ink);padding-bottom:16px}
.rowh h3{font-size:28px;font-weight:500}
.rowh a{font-size:15px;color:var(--mute)}.rowh a:hover{color:var(--ink)}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:32px;margin-top:32px}
.shopgrid{display:grid;grid-template-columns:220px 1fr;gap:48px;margin-top:32px}
#filters{position:sticky;top:150px;align-self:start}
.fg{padding:0 0 22px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.fg b{display:block;font-weight:500;font-size:14px;margin-bottom:10px}
.chk{display:flex;align-items:center;gap:10px;font-size:14.5px;color:#3B3934;padding:4px 0;cursor:pointer}
.chk input{accent-color:var(--acc);width:15px;height:15px}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swatch{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;color:#3B3934}
.swatch input{position:absolute;opacity:0;pointer-events:none}
.swatch i{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatch.on i{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.swatch:focus-within i{outline:2px solid var(--acc);outline-offset:2px}
.toolbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:24px}
.toolbar select,#pd-em{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);padding:7px 10px}
#grid{grid-template-columns:repeat(3,1fr)!important;margin-top:0!important}
.none{color:var(--mute)}
.pcrumb{font-size:13.5px;color:var(--mute);margin-bottom:24px}.pcrumb a:hover{color:var(--ink)}
#pd-glaze{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);margin-top:10px}
#pd-glaze i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
#pd-angles{display:flex;gap:10px;justify-content:center}
#pd-angles button{width:64px;height:64px;border:1px solid var(--line);background:var(--bg)}
#pd-angles button:hover,#pd-angles button#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{border-color:var(--ink)}
#pd-angles img{width:100%;height:100%;object-fit:contain}
.buy{margin-top:26px;padding-top:22px;border-top:1px solid var(--ink)}
.brow{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px;font-size:14px}
.brow label{color:var(--mute)}
#pd-stock{font-size:14px;margin-bottom:18px}#pd-stock .ok{color:#2F6B3A}
#pd-qty{width:70px;font:inherit;padding:8px 10px;border:1px solid var(--line);background:none}
.pbtns2{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
details{border-bottom:1px solid var(--line);padding:14px 0}
details:first-of-type{margin-top:26px;border-top:1px solid var(--line)}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--mute)}details[open] summary::after{content:"−"}
details p{margin-top:10px;color:#3B3934;font-size:15px;line-height:1.55}
.relW{padding:20px 48px 80px;max-width:1440px;margin:0 auto}
.fab{position:fixed;inset-inline-end:28px;bottom:28px;z-index:25;background:var(--ink);color:var(--bg);padding:14px 20px;font-size:15px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .4s var(--e)}
.fab:hover{transform:translateY(-3px)}.fab i{width:8px;height:8px;border-radius:50%;background:#7CD992}
.chat-open .fab,.bag-open .fab{opacity:0;pointer-events:none}
.hf{display:flex;flex-direction:column;gap:8px}
.hf input,.hf textarea{font:inherit;font-size:14px;border:1px solid var(--line);background:#fff;padding:9px 10px;resize:vertical}
.primary.sm{padding:10px 16px;font-size:14px}
.link.sm{font-size:13.5px;margin-top:10px;display:inline-block}
.dfoot{display:flex;justify-content:space-between;padding:0 30px 16px;font-size:13px}
.stepper{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px}
.stepper button{width:24px;height:24px;border:1px solid var(--line)}.stepper button:disabled{opacity:.3}
.stepper .rm{width:auto;border:0;color:var(--mute);text-decoration:underline}
#bag-list li{grid-template-columns:56px 1fr auto!important;align-items:start!important}
#bag-list li div b{font-weight:500;display:block}#bag-list li div span{color:var(--mute);font-size:13px}
.brows{padding:14px 30px;border-top:1px solid var(--line);font-size:14px}
.brows div{display:flex;justify-content:space-between;padding:3px 0}
.brows .tot{font-weight:500;font-size:16px;padding-top:8px}
.inboxW table{width:100%;border-collapse:collapse;margin-top:24px;font-size:14.5px}
.inboxW td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.inboxW .sub{display:block;color:var(--mute);font-size:13px}.mono{font-family:Plex;font-weight:500}.mute{color:var(--mute)}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);padding:10px 16px;font-size:14px;opacity:0;transition:.3s;z-index:40;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media(max-width:1100px){.cats{display:none}}
@media(max-width:900px){
  #announce{font-size:11.5px}
  header{padding:12px 16px;gap:12px}.hsearch{width:110px}
  #v-home .heroW{height:auto;min-height:auto}
  .newin,.relW{padding:40px 20px}
  .four{grid-template-columns:repeat(2,1fr);gap:16px}
  .shopgrid{grid-template-columns:1fr;gap:20px}
  #filters{position:static;display:flex;gap:18px;overflow-x:auto;padding-bottom:10px}
  .fg{min-width:170px;border:0;margin:0;padding:0}
  #grid{grid-template-columns:repeat(2,1fr)!important}
  #v-product .pgrid{padding-top:90px}
  .stagecol{position:relative;top:0;height:auto}#big{height:52vh;flex:none}
  #pd-angles{position:static;margin-top:8px}
  .fab{inset-inline-end:16px;bottom:16px;padding:12px 16px}
  #form{margin:0 20px 12px}#q{min-width:0;padding-inline-end:10px;font-size:15px}
}

</style>
</head>
<body>
<canvas id="shot" aria-hidden="true"></canvas>
<div id="announce"></div>
<header>
  <a class="logo" href="#"><svg viewBox="0 0 16 26" aria-hidden="true"><path d="M8 25 C3 24 1 19 2 14 C3 9 7 7 6 3 L7 1"/></svg>Raml Home</a>
  <nav class="cats" aria-label="Categories">
    <a href="#shop-vase" data-k="vase"></a><a href="#shop-bowl" data-k="bowl"></a><a href="#shop-cup" data-k="cup"></a><a href="#shop-plate" data-k="plate"></a><a href="#shop-planter" data-k="planter"></a><a href="#shop-jug" data-k="jug"></a><a href="#shop-candle" data-k="candle"></a>
  </nav>
  <nav aria-label="Account">
    <label class="hsearch"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="q2" aria-label="Search"></label>
    <button id="langbtn" data-t="lang"></button>
    <button id="bagbtn"><span data-t="bag"></span> (<span id="bagn">0</span>)</button>
  </nav>
</header>

<section class="view" id="v-home">
  <div class="heroW">
    <canvas id="hero"></canvas>
    <div class="htext">
      <div class="k" data-t="kicker"></div>
      <h1><span data-t="h1a"></span><span data-t="h1b"></span></h1>
      <p class="sub" data-t="sub"></p>
      <div class="ctas"><a href="#shop" data-t="cta1"></a><a href="#" data-chat data-t="cta2"></a></div>
    </div>
    <div id="hero-prof" aria-hidden="true"></div>
  </div>
  <div class="newin"><div class="rowh"><h3 data-t="newIn"></h3><a href="#shop" data-t="viewAll"></a></div><div class="four" id="newin"></div></div>
  <footer><span data-t="demo"></span><span>Built by Lana Alzoubi · lanaalzoubi.com</span></footer>
</section>

<section class="view" id="v-shop">
  <div class="wrap">
    <div class="chead"><h2 id="shop-title"></h2></div>
    <div class="shopgrid">
      <aside id="filters" aria-label="Filters"></aside>
      <div><div class="toolbar"><span id="count"></span><label><span data-t="sort"></span> <select id="sort"></select></label></div><div id="grid"></div></div>
    </div>
  </div>
  <footer><span data-t="demo"></span><span>Built by Lana Alzoubi · lanaalzoubi.com</span></footer>
</section>

<section class="view" id="v-product">
  <div class="pgrid">
    <div class="stagecol"><canvas id="big"></canvas><div id="pd-angles"></div></div>
    <div class="pinfo">
      <div class="pcrumb" id="pd-crumb"></div>
      <h2 id="pd-name"></h2>
      <div class="prow"><span id="pd-price"></span><span id="pd-prof"></span></div>
      <div id="pd-glaze"></div>
      <p id="pd-desc"></p>
      <div class="buy">
        <div class="brow"><label for="pd-em" data-t="deliverTo"></label><select id="pd-em"></select></div>
        <div id="pd-stock"></div>
